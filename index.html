<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>Markdown Viewer</h1>
      <div class="actions">
        <button id="reload-button" type="button" aria-label="Reload markdown content">Reload Markdown</button>
      </div>
    </header>
    <main class="content-wrapper">
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <article id="content" class="markdown-body" aria-label="Markdown content"></article>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" integrity="sha384-vuFHotE5T7V6czS4fFqqpwPIYOvToNiOfzmiEJeZVrDCTnhgypKekJy5o+1OtSWT" crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
