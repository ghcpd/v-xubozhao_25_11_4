<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="container header-content">
      <h1 class="app-title">Markdown Viewer</h1>
      <button id="reloadBtn" type="button" class="primary-btn" aria-label="Reload sample markdown">
        Reload Markdown
      </button>
    </div>
  </header>

  <main class="container main-content" role="main">
    <section class="viewer-panel" aria-labelledby="previewTitle">
      <div class="viewer-header">
        <h2 id="previewTitle">Preview</h2>
        <p class="viewer-subtitle">Rendered from <code>sample_markdown.md</code></p>
      </div>
      <div id="content" class="markdown-content" aria-live="polite"></div>
    </section>
  </main>

  <footer class="app-footer">
    <div class="container footer-content">
      <span class="footer-text">Tip: Edit <code>sample_markdown.md</code> to update this preview.</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" integrity="sha384-XVJ9NVr2myQvwcbUhJQWIl4GngI/7Y1rR0FbSek2DjI4kOtFmS/z/IB1ceKtlCWK" crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
